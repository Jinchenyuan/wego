apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wego-http-server.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "wego-http-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
